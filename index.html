<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: black;
      overflow: hidden;
      font-family: monospace;
      color: #00ffcc;
    }

    .glow {
      position: absolute;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #00ffcc, transparent);
      filter: blur(40px);
      animation: move 6s infinite alternate;
    }

    @keyframes move {
      from { transform: translate(0,0); }
      to { transform: translate(300px,200px); }
    }

    .text {
      text-align: center;
      margin-top: 40vh;
      font-size: 2rem;
    }
  </style>
</head>

<body>
  <div class="glow"></div>
  <div class="text">Welcome to my GitHub Page</div>
</body>
</html>
